name: Python and Docker checks

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m py_compile drift.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t saim-downloader .
      - name: Run container and check health endpoint
        run: |
          set -e
          docker run -d --name downloader-smoke -p 5000:5000 -v downloader-smoke-data:/data saim-downloader
          trap 'docker rm -f downloader-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs downloader-smoke
          exit 1
